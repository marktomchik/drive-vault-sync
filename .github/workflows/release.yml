name: Release

# Publishes a release whenever manifest.json on main carries a version that has no release yet.
# The workflow creates the tag itself (tag = version, without a "v" prefix, as Obsidian requires).
on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          patch_dir="patches/$version"
          if [ -f "$patch_dir/BASE" ]; then
            # Patched release: the source in src/ is older than the released bundle,
            # so main.js is the BASE release's main.js with this version's patch applied.
            base="$(tr -d '[:space:]' < "$patch_dir/BASE")"
            gh release download "$base" --pattern main.js --output base-main.js
            node "$patch_dir/apply.mjs" base-main.js main.js
            node --check main.js
            BUNDLE="$PWD/main.js" node --test "$patch_dir/patch.test.mjs"
            if [ ! -f styles.css ]; then gh release download "$base" --pattern styles.css --output styles.css; fi
          else
            npm ci
            npm test
            npm run build
          fi

      - name: Create release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "$version" \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --generate-notes \
            main.js manifest.json styles.css
